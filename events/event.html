<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>event planning</title>
    <link rel="icon" type="image/png" href="../img/favicon_design.png">
    <style>
        @font-face {
            font-family: 'TypestarOCR';
            src: url('../fonts/Typestar-OCR.otf') format('opentype');
            font-display: swap;
        }
        @font-face {
            font-family: 'TypestarNormal';
            src: url('../fonts/Typestar-Normal.otf') format('opentype');
            font-display: swap;
        }
        @font-face {
            font-family: 'AvenirNext';
            src: url('../fonts/Avenir Next.ttc') format('truetype');
            font-display: swap;
        }

        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            min-height: 100%;
            overflow-x: hidden;
        }

        body {
            background: #3e3e70;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 24px 16px;
            position: relative;
        }

        /* ── Ambient blob background ── */
        .bg-blobs {
            position: fixed;
            inset: 0;
            z-index: 0;
            overflow: hidden;
            pointer-events: none;
        }

        .blob {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.85;
        }

        .blob-1 {
            width: 55vw;
            height: 55vw;
            background: rgba(140, 38, 235, 0.582);
            top: -10%;
            left: -15%;
            animation: drift-1 16s ease-in-out infinite alternate;
        }
        .blob-2 {
            width: 45vw;
            height: 45vw;
            background: rgba(207, 94, 2, 0.702);
            top: 30%;
            right: -10%;
            animation: drift-2 19s ease-in-out infinite alternate;
        }
        .blob-3 {
            width: 40vw;
            height: 40vw;
            background: rgba(100, 200, 246, 0.862);
            bottom: -5%;
            left: 20%;
            animation: drift-3 14s ease-in-out infinite alternate;
        }
        .blob-4 {
            width: 30vw;
            height: 30vw;
            background: rgba(191, 38, 211, 0.532);
            top: 55%;
            left: -5%;
            animation: drift-4 21s ease-in-out infinite alternate;
        }

        @keyframes drift-1 {
            from { transform: translate(0, 0) scale(1); }
            to   { transform: translate(8vw, 6vh) scale(1.1); }
        }
        @keyframes drift-2 {
            from { transform: translate(0, 0) scale(1); }
            to   { transform: translate(-6vw, -8vh) scale(0.95); }
        }
        @keyframes drift-3 {
            from { transform: translate(0, 0) scale(1); }
            to   { transform: translate(5vw, -5vh) scale(1.08); }
        }
        @keyframes drift-4 {
            from { transform: translate(0, 0) scale(1); }
            to   { transform: translate(7vw, 4vh) scale(1.05); }
        }

        /* ── Card wrapper ── */
        .card-wrapper {
            position: relative;
            z-index: 1;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }

        /* ── Card ── */
        .links-card {
            background: #f8f9e7;
            border: 8.5px solid #9d5ed1;
            border-radius: 52px;
            padding: 22px;
            width: 100%;
            max-width: 374px;
            text-align: center;
            display: flex;
            flex-direction: column;
        }

        /* ── Header ── */
        .card-header {
            font-family: 'TypestarOCR', monospace;
            font-size: 24px;
            font-weight: 1000;
            color: rgba(195, 55, 12, 0.85);
            margin-bottom: 14px;
            letter-spacing: -0.01em;
        }

        .card-subtitle {
            font-family: 'TypestarOCR', monospace;
            font-size: 14px;
            font-weight: 200;
            color: rgba(0, 0, 0, 0.85);
            margin-bottom: 20px;
            margin-top:10px;
            letter-spacing: -0.01em;
            border-color: #9d5ed1;
            border-style:dotted;
            border-radius: 20%;
            background-color: aliceblue;
        }

        /* ── Collage image ── */
        .collage-img {
            width: 100%;
            border-radius: 20px;
            display: block;
            margin-bottom: 14px;
            flex: 1 1 0;
            min-height: 0;
            object-fit: cover;
            object-position: top center;
        }

        /* ── Nav links ── */
        .nav-links {
            list-style: none;
            margin: 4px 0 12px;
        }

        .nav-links hr {
            border: none;
            border-top: 1px solid rgba(0, 0, 0, 0.1);
            margin: 8.7px 0;
        }

        .nav-link-item a {
            display: block;
            font-family: 'TypestarNormal', 'Helvetica Neue', sans-serif;
            font-size: 32px;
            font-weight: 700;
            color: rgba(0, 0, 0, 0.85);
            letter-spacing: -0.01em;
            text-decoration: none;
            padding: 2px 0;
            transition: opacity 0.15s;
            -webkit-tap-highlight-color: transparent;
        }

        .nav-link-item a:hover { opacity: 0.6; }

        .link-icon {
            display: inline-flex;
            align-items: center;
            margin-right: 8px;
            vertical-align: middle;
            position: relative;
            top: -2px;
        }
        .link-icon svg {
            width: 26px;
            height: 26px;
        }

        /* ── Bird section ── */
        .bird-section {
            margin: 20px 0 4px;
        }

        .bird-label {
            font-family: 'TypestarNormal', 'Helvetica Neue', sans-serif;
            font-size: 17px;
            font-weight: 700;
            font-style: italic;
            color: rgb(25, 82, 139);
            display: block;
            margin-bottom: 4px;
            line-height: 1.3;
        }

        .bird-links {
            font-family: 'TypestarNormal', 'Helvetica Neue', sans-serif;
            font-size: 21px;
            font-weight: 400;
            color: rgba(0, 0, 0, 0.85);
        }

        .bird-links a {
            color: rgba(0, 0, 0, 0.85);
            text-decoration: none;
            -webkit-tap-highlight-color: transparent;
        }

        .bird-links a:hover { text-decoration: underline; }

        .cloud-icon {
            display: inline-flex;
            align-items: center;
            margin: 0 6px;
            vertical-align: middle;
            position: relative;
            top: -1px;
        }
        .cloud-icon svg {
            width: 22px;
            height: 22px;
        }

        /* ── Social row ── */
        .social-hr {
            border: none;
            border-top: 1px solid rgba(0, 0, 0, 0.1);
            margin: 10px 0;
        }

        .social-row {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 28px;
        }

        .social-row a {
            color: rgba(0, 0, 0, 0.85);
            text-decoration: none;
            transition: opacity 0.15s;
            display: flex;
            align-items: center;
            -webkit-tap-highlight-color: transparent;
        }

        .social-row a:hover { opacity: 0.6; }
        .social-row a.lastfm-link:hover { opacity: 1; fill: #d51007; }
        .social-row a.lastfm-link:hover svg { fill: #d51007; }

        .social-row svg {
            width: 29px;
            height: 29px;
            fill: rgba(0, 0, 0, 0.85);
        }


        /* ── Form: base ── */
        .event-form {
            /* gap between sections: name/email - days - movies */
            --section-gap: 34px;
            text-align: left;
            font-family: 'TypestarOCR', monospace;
            margin-top: 4px;
        }

        .f-row { margin-bottom: 14px; }

        .f-label,
        .f-legend {
            display: block;
            font-size: 12px;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            color: rgba(0, 0, 0, 0.55);
            margin-bottom: 5px;
        }

        .f-input {
            width: 100%;
            font-family: inherit;
            font-size: 15px;
            padding: 8px 10px;
            border: 1.5px solid rgba(0, 0, 0, 0.25);
            border-radius: 8px;
            background: #fff;
            color: rgba(0, 0, 0, 0.85);
        }

        .f-input:focus-visible {
            outline: 2px solid #9d5ed1;
            outline-offset: 1px;
        }

        .f-group {
            border: none;
            margin: var(--section-gap) 0;
        }

        /* ── Form: date checkboxes (barebones) ── */
        .f-check {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            color: rgba(0, 0, 0, 0.85);
            padding: 3px 0;
            cursor: pointer;
        }

        /* ── Form: movie picker ── */
        .covers {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .cover {
            display: block;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }

        /* real radio, kept for a11y + keyboard, visually gone */
        .cover input {
            position: absolute;
            opacity: 0;
            width: 1px;
            height: 1px;
            pointer-events: none;
        }

        .cover-title {
            display: flex;
            align-items: flex-end;
            justify-content: center;
            min-height: 3.4em;
            font-family: 'arial';
            font-size: 10px;
            font-weight: 1000;
            line-height: 1.25;
            letter-spacing: 0.07em;
            text-transform: uppercase;
            text-align: center;
            color: rgb(38, 37, 37);
            margin-bottom: 6px;
            transition: color 0.2s;
        }

        .cover-art {
            position: relative;
            display: block;
            aspect-ratio: 492 / 804;
            border-radius: 3px 9px 9px 3px;
            overflow: hidden;
            background: #000;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.28),
                        0 8px 18px rgba(0, 0, 0, 0.18);
            transition: transform 0.25s ease, box-shadow 0.25s ease,
                        filter 0.25s ease, opacity 0.25s ease;
        }

        .cover-art img {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: cover;
            /* framing knobs: zoom creates the crop room that x/y shift into.
               keep zoom high enough that the shift never exposes an edge. */
            transform: scale(var(--img-zoom, 1))
                       translate(var(--img-x, 0), var(--img-y, 0));
        }

        /* nudge nirvanna's framing right */
        .cover-art--ntbtstm img {
            --img-zoom: 1.14;
            --img-x: 5%;
        }

        /* plastic case: left hinge/spine + permanent top gloss */
        .cover-art::before {
            content: '';
            position: absolute;
            inset: 0;
            z-index: 2;
            pointer-events: none;
            background:
                linear-gradient(90deg,
                    rgba(255, 255, 255, 0.38) 0px,
                    rgba(255, 255, 255, 0.05) 3px,
                    rgba(0, 0, 0, 0.22) 6px,
                    rgba(0, 0, 0, 0.05) 9px,
                    rgba(0, 0, 0, 0) 14px),
                linear-gradient(160deg,
                    rgba(255, 255, 255, 0.22) 0%,
                    rgba(255, 255, 255, 0.04) 32%,
                    rgba(255, 255, 255, 0) 55%);
        }

        /* the shine sweep */
        .cover-art::after {
            content: '';
            position: absolute;
            top: -60%;
            bottom: -60%;
            left: -40%;
            width: 45%;
            z-index: 3;
            pointer-events: none;
            transform: translateX(-260%) rotate(18deg);
            background: linear-gradient(90deg,
                rgba(255, 255, 255, 0) 0%,
                rgba(255, 255, 255, 0.10) 35%,
                rgba(255, 255, 255, 0.70) 50%,
                rgba(255, 255, 255, 0.10) 65%,
                rgba(255, 255, 255, 0) 100%);
            transition: transform 0.75s cubic-bezier(0.25, 0.6, 0.3, 1);
        }

        .cover:hover .cover-art::after,
        .cover input:focus-visible ~ .cover-art::after,
        .cover input:checked ~ .cover-art::after {
            transform: translateX(520%) rotate(18deg);
        }

        .cover:hover .cover-art {
            transform: translateY(-3px);
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.30),
                        0 14px 26px rgba(0, 0, 0, 0.22);
        }

        .cover input:checked ~ .cover-art {
            transform: translateY(-3px);
            box-shadow: 0 0 0 3px #9d5ed1,
                        0 4px 10px rgba(0, 0, 0, 0.30),
                        0 14px 26px rgba(0, 0, 0, 0.20);
        }

        .cover input:checked ~ .cover-title {
            color: rgba(195, 55, 12, 0.95);
        }

        .cover input:focus-visible ~ .cover-art {
            outline: 2px solid #9d5ed1;
            outline-offset: 3px;
        }

        /* dim the one you didn't pick */
        .covers:has(input:checked) .cover:not(:has(input:checked)) .cover-art {
            filter: saturate(0.55) brightness(0.82);
            opacity: 0.75;
        }

        /* ── Form: submit ── */
        .f-submit {
            width: 100%;
            font-family: inherit;
            font-size: 15px;
            padding: 10px;
            margin-top: 4px;
            border: 1.5px solid rgba(0, 0, 0, 0.25);
            border-radius: 8px;
            background: #fff;
            color: rgba(0, 0, 0, 0.85);
            cursor: pointer;
        }

        .f-status {
            font-size: 13px;
            text-align: center;
            margin-top: 8px;
            min-height: 1.2em;
            color: rgba(0, 0, 0, 0.6);
        }

        @media (prefers-reduced-motion: reduce) {
            .cover-art,
            .cover-art::after { transition: none; }
        }

        /* ── Desktop ── */
        @media (min-width: 600px) {
            body { padding: 37px 47px 40px; }
        }
    </style>
</head>
<body>

    <!-- Ambient blob background -->
    <div class="bg-blobs">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
        <div class="blob blob-4"></div>
    </div>

    <!-- Card -->
    <div class="card-wrapper">
        <div class="links-card">

            <p class="card-header">hi lets watch a movie</p>
            <div class="card-subtitle"><p> i cant plan for shit, so im sending this out to anyone interested in watching a movie together.
            <br><br>i know some of you haven't seen either or both of these, and some of you may hate one or both of these. pick ur poison if u wanna hang
            </p></div>

            <form class="event-form" id="event-form">

                <div class="f-row">
                    <label class="f-label" for="fname">name</label>
                    <input class="f-input" type="text" id="fname" name="fname" required>
                </div>

                <div class="f-row">
                    <label class="f-label" for="email">email</label>
                    <input class="f-input" type="email" id="email" name="email" required>
                </div>

                <fieldset class="f-group">
                    <legend class="f-legend">what days work</legend>
                    <!-- TODO: swap in the real candidate dates -->
                    <label class="f-check"><input type="checkbox" name="dates" value="Fri Oct 3"> wed oct 8</label>
                    <label class="f-check"><input type="checkbox" name="dates" value="Sat Oct 4"> thurs oct 9</label>
                    <label class="f-check"><input type="checkbox" name="dates" value="Sun Oct 5"> wed oct 14</label>
                    <label class="f-check"><input type="checkbox" name="dates" value="Fri Oct 10"> thurs oct 15</label>
                    <label class="f-check"><input type="checkbox" name="dates" value="Sat Oct 11"> sat oct 11</label>
                </fieldset>

                <fieldset class="f-group">
                    <legend class="f-legend" style="text-align: center;">pick ur poison</legend>
                    <div class="covers">

                        <label class="cover">
                            <input type="radio" name="movie" value="hobv" required>
                            <span class="cover-title">hundreds of beavers</span>
                            <span class="cover-art">
                                <img src="img/hobv.png" alt="">
                            </span>
                        </label>

                        <label class="cover">
                            <input type="radio" name="movie" value="ntbtstm">
                            <span class="cover-title">nirvanna the band the show the movie</span>
                            <span class="cover-art cover-art--ntbtstm">
                                <img src="img/ntbtstm.png" alt="">
                            </span>
                        </label>

                    </div>
                </fieldset>

                <button class="f-submit" type="submit">send it</button>
                <p class="f-status" id="form-status" role="status"></p>

            </form>

            

        </div>
    </div>

</body>
</html>
