<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>submitted!</title>

    <!-- Google Analytics GA4 -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-HY2PLLJWGS"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){ dataLayer.push(arguments); }
      gtag('js', new Date());
      gtag('config', 'G-HY2PLLJWGS');
    </script>

    <link rel="icon" type="image/png" href="../img/favicon_design.png">
    <link rel="preload" as="image" href="img/uv_hamter.png">
    <link rel="stylesheet" href="style.css">
    <style>
        /* ── Sent: the hamster ── edit these ──
           kicked off by the script at the end of <body>, not on load */
        .sent-flash {
            position: fixed;
            inset: 0;
            z-index: 50;
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: none;
        }

        .sent-flash img {
            width: 210px;
            max-width: 52vw;
            height: auto;
            /* iOS Safari may not paint until after a navigation settles, so an
               animation started at parse time can finish before you see it.
               .is-playing is added by JS once the page is visible + img decoded. */
            opacity: 0;
        }

        .sent-flash.is-playing img {
            animation: hamter-flash 1.1s cubic-bezier(0.3, 0.7, 0.3, 1) forwards;
        }

        @keyframes hamter-flash {
            0%   { transform: scale(1.4); opacity: 0; }
            12%  { transform: scale(1.3); opacity: 1; }
            45%  { transform: scale(1);   opacity: 1; }
            100% { transform: scale(0.3); opacity: 0; }
        }

        /* ── Sent: the payoff ── edit these ── */
        .sent-body {
            text-align: center;
            /* held back until the hamster is most of the way out */
            opacity: 0;
            animation: sent-in 0.5s ease-out 0.75s forwards;
            margin: 10px;
        }

        .sent-img {
            width: 100%;
            border-radius: 14px;
            display: block;
        }

        @keyframes sent-in {
            from { opacity: 0; transform: translateY(10px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        @media (prefers-reduced-motion: reduce) {
            /* still show him, just fade instead of scaling */
            .sent-flash.is-playing img { animation: hamter-fade 1.1s ease-out forwards; }
            .sent-body { opacity: 1; animation: none; }
        }

        @keyframes hamter-fade {
            0%   { opacity: 0; }
            15%  { opacity: 1; }
            60%  { opacity: 1; }
            100% { opacity: 0; }
        }

        .links-row {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 28px;
            margin-top: 40px;
        }

        .links-row a {
            color: rgba(0, 0, 0, 0.85);
            text-decoration: none;
            transition: opacity 0.15s;
            display: flex;
            align-items: center;
            -webkit-tap-highlight-color: transparent;
        }

        .links-row a:hover { opacity: 0.6; }

        .links-row img {
            height: 49px;
            transform-origin: 50% 85%;
            animation: peanut-wiggle 2.8s ease-in-out infinite;
        }

        /* pauses on hover so it holds still while you aim at it */
        .links-row a:hover img { animation-play-state: paused; }

        @keyframes peanut-wiggle {
            0%, 62%, 100% { transform: rotate(0deg); }
            68%  { transform: rotate(-9deg); }
            74%  { transform: rotate(7deg); }
            80%  { transform: rotate(-5deg); }
            86%  { transform: rotate(3deg); }
            92%  { transform: rotate(-1.5deg); }
        }

        @media (prefers-reduced-motion: reduce) {
            .links-row img { animation: none; }
        }
    </style>
</head>
<body>

    <!-- Ambient blob background -->
    <div class="bg-blobs">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
        <div class="blob blob-4"></div>
    </div>

    <!-- thumbs up, then gone -->
    <div class="sent-flash" id="sent-flash" aria-hidden="true">
        <img src="img/uv_hamter.png" alt="">
    </div>

    <!-- Card -->
    <div class="card-wrapper">
        <div class="links-card">

            <p class="card-header" style="color:rgb(3, 116, 3);">submitted!</p>

            <div class="sent-body">
                <img class="sent-img" src="img/IMG_8831.GIF" alt="blink cat" style="margin-top:30px">
            </div>

            <div class="links-row">
                <a href="https://media.ebird.org/catalog?unconfirmed=incl&mediaType=photo&userId=USER3040926" target="_blank"><img src="img/peanut.png" alt="peanut"></a>
            </div>

        </div>
    </div>


    <script>
        // pageshow (not load) so this also fires on iOS back-forward cache restores
        window.addEventListener('pageshow', function () {
            var wrap = document.getElementById('sent-flash');
            var img = wrap.querySelector('img');

            function play() {
                wrap.classList.remove('is-playing');
                void wrap.offsetWidth;            // restart if replayed
                wrap.classList.add('is-playing');
            }

            function whenVisible() {
                if (document.visibilityState === 'hidden') {
                    document.addEventListener('visibilitychange', whenVisible, { once: true });
                    return;
                }
                requestAnimationFrame(function () { requestAnimationFrame(play); });
            }

            if (img.complete && img.naturalWidth) whenVisible();
            else img.addEventListener('load', whenVisible, { once: true });
        });
    </script>

</body>
</html>
