<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>submitted!</title>
    <link rel="icon" type="image/png" href="../img/favicon_design.png">
    <link rel="stylesheet" href="style.css">
    <style>
        /* ── Sent: the hamster ── edit these ──
           no JS needed: the animation runs on load and ends on opacity 0 */
        .sent-flash {
            position: fixed;
            inset: 0;
            z-index: 50;
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: none;
        }

        .sent-flash img {
            width: 210px;
            max-width: 52vw;
            height: auto;
            /* the png has a white background, so multiply drops it into the card */
            mix-blend-mode: multiply;
            animation: hamter-flash 1.1s cubic-bezier(0.3, 0.7, 0.3, 1) forwards;
        }

        @keyframes hamter-flash {
            0%   { transform: scale(1.4); opacity: 0; }
            12%  { transform: scale(1.3); opacity: 1; }
            45%  { transform: scale(1);   opacity: 1; }
            100% { transform: scale(0.3); opacity: 0; }
        }

        /* ── Sent: the payoff ── edit these ── */
        .sent-body {
            text-align: center;
            /* held back until the hamster is most of the way out */
            opacity: 0;
            animation: sent-in 0.5s ease-out 0.75s forwards;
            margin: 10px;
        }

        .sent-img {
            width: 100%;
            border-radius: 14px;
            display: block;
        }

        @keyframes sent-in {
            from { opacity: 0; transform: translateY(10px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        @media (prefers-reduced-motion: reduce) {
            .sent-flash { display: none; }
            .sent-body { opacity: 1; animation: none; }
        }

        .links-row {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 28px;
            margin-top: 40px;
        }

        .links-row a {
            color: rgba(0, 0, 0, 0.85);
            text-decoration: none;
            transition: opacity 0.15s;
            display: flex;
            align-items: center;
            -webkit-tap-highlight-color: transparent;
        }

        .links-row a:hover { opacity: 0.6; }

        .links-row img {
            height: 49px;
        }
    </style>
</head>
<body>

    <!-- Ambient blob background -->
    <div class="bg-blobs">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
        <div class="blob blob-4"></div>
    </div>

    <!-- thumbs up, then gone -->
    <div class="sent-flash" aria-hidden="true">
        <img src="img/uv_hamter.png" alt="">
    </div>

    <!-- Card -->
    <div class="card-wrapper">
        <div class="links-card">

            <p class="card-header" style="color:rgb(3, 116, 3);">submitted!</p>

            <div class="sent-body">
                <img class="sent-img" src="img/smile_hamter.png" alt="smile" style="height:140px; width:150px;">
                <img class="sent-img" src="img/dfy.JPG" alt="dude, fuck yes" style="margin-top:30px">
            </div>

            <div class="links-row">
                <a href="https://media.ebird.org/catalog?unconfirmed=incl&mediaType=photo&userId=USER3040926" target="_blank"><img src="img/peanut.png" alt="peanut"></a>
            </div>

        </div>
    </div>

</body>
</html>
